[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-process = "=2.3.1"
tauri-plugin-shell = "=2.3.6"
tauri-plugin-updater = "=2.11.0"
pretty_assertions = "1.4.0"
glob = "0.3.1"
regex = "1.10.6"
lazy_static = "1.5.0"
rayon = "1.10"
ahash = "0.8"
# MCP server + dependencies
rmcp = { version = "0.9", features = ["server", "transport-streamable-http-server", "macros", "base64"] }
schemars = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net"] }
axum = "0.8"
tower = "0.5"
hyper = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
rand = "0.9"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
